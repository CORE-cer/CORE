name: Valgrind Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  run-valgrind-debug:
    strategy:
      matrix:
        compiler_profile: [clang-libstdcxx, gcc-libstdcxx]
        include:
          - compiler_profile: clang-libstdcxx
            check_name: x86_64-linux-clang-libstdc
          - compiler_profile: gcc-libstdcxx
            check_name: x86_64-linux-gcc-libstdc
    name: run-valgrind-debug (${{ matrix.check_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Export GitHub Actions cache variables
        run: |
          echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}" >> $GITHUB_ENV
          echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}
          create-symlink: true

      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release gnupg software-properties-common curl
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-apt.key
          echo "8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  /tmp/llvm-apt.key" | sha256sum --check -
          test "$(gpg --show-keys --with-colons /tmp/llvm-apt.key | awk -F: '$1 == "fpr" { print $10; exit }')" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo gpg --dearmor --yes --output /etc/apt/keyrings/llvm-apt.gpg /tmp/llvm-apt.key
          rm /tmp/llvm-apt.key
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.llvm.org/noble/' \
            'Suites: llvm-toolchain-noble-21' \
            'Components: main' \
            'Architectures: amd64' \
            'Signed-By: /etc/apt/keyrings/llvm-apt.gpg' | sudo tee /etc/apt/sources.list.d/llvm.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-format-21 clang-tidy-21
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Set up GCC
        run: |
          sudo apt install gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 60 --slave /usr/bin/g++ g++ /usr/bin/g++-14 && sudo update-alternatives --config gcc

      - name: Check versions
        run: |
          clang --version
          clang-format --version
          gcc -v

      - name: Run valgrind
        run: sudo apt install -y valgrind

      - name: Install vcpkg system dependencies
        run: sudo apt install -y curl zip unzip tar pkg-config autoconf automake libtool

      - name: Install dependencies
        run: chmod +x ./scripts/install_dependencies.sh && ./scripts/install_dependencies.sh

      - name: base build
        run: chmod +x ./scripts/build.sh && ./scripts/build.sh -b Debug -c ${{ matrix.compiler_profile }}

      - name: build with grammar
        run: chmod +x ./scripts/build_grammar.sh && ./scripts/build_grammar.sh -b Debug -c ${{ matrix.compiler_profile }}

      - name: run valgrind with no sanitizer
        run: chmod +x ./scripts/build_and_valgrind.sh && ./scripts/build_and_valgrind.sh -b Debug -c ${{ matrix.compiler_profile }}
