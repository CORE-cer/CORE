name: Sanitizer Wheels

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-sanitizer-wheels:
    strategy:
      matrix:
        sanitizer: [address, thread]
        include:
          - sanitizer: address
            artifact_name: pycer-asan-wheel
          - sanitizer: thread
            artifact_name: pycer-tsan-wheel
    name: build-${{ matrix.sanitizer }}-sanitizer-wheel
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Export GitHub Actions cache variables
        run: |
          echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}" >> "$GITHUB_ENV"
          echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7.3.0

      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release gnupg software-properties-common curl
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-apt.key
          echo "8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  /tmp/llvm-apt.key" | sha256sum --check -
          test "$(gpg --show-keys --with-colons /tmp/llvm-apt.key | awk -F: '$1 == "fpr" { print $10; exit }')" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo gpg --dearmor --yes --output /etc/apt/keyrings/llvm-apt.gpg /tmp/llvm-apt.key
          rm /tmp/llvm-apt.key
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.llvm.org/noble/' \
            'Suites: llvm-toolchain-noble-21' \
            'Components: main' \
            'Architectures: amd64' \
            'Signed-By: /etc/apt/keyrings/llvm-apt.gpg' | sudo tee /etc/apt/sources.list.d/llvm.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-format-21 clang-tidy-21 libclang-rt-21-dev
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Install vcpkg system dependencies
        run: sudo apt install -y curl zip unzip tar pkg-config autoconf automake libtool

      - name: Install dependencies
        run: chmod +x ./scripts/install_dependencies.sh && ./scripts/install_dependencies.sh

      - name: Build sanitizer wheel
        run: |
          uv build --wheel \
            --config-settings=cmake.define.CMAKE_C_COMPILER=clang \
            --config-settings=cmake.define.CMAKE_CXX_COMPILER=clang++ \
            --config-settings=cmake.define.CMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            --config-settings=cmake.define.VCPKG_TARGET_TRIPLET=x64-linux-clang-libstdcxx \
            --config-settings=cmake.define.${{ matrix.sanitizer == 'address' && 'ADDRESS_SANITIZER' || 'THREAD_SANITIZER' }}=ON \
            --config-settings=cmake.build-type=RelWithDebInfo

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./dist/*.whl
